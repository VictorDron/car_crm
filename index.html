<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grupo Windcar · CRM para revenda de veículos</title>
<meta name="description" content="Grupo Windcar — o CRM que entende revenda de veículos. Não vende uma vez, cuida até a próxima troca." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================== TOKENS ============================== */
:root{
  --brand:#E11226; --brand-600:#C30E20; --brand-700:#9E0B1A; --brand-800:#7A0814;
  --brand-tint:#FDE7E9; --brand-tint-2:#FBD4D8; --brand-deep:#4E0810;
  --green:#15A34A; --green-tint:#DCFCE7; --green-ink:#0F7a37;
  --amber:#E0900B; --amber-tint:#FEF1D6; --amber-ink:#9a6206;
  --blue:#2563EB; --blue-tint:#DCE7FE; --blue-ink:#1d4ed8;
  --purple:#7C3AED; --purple-tint:#EDE5FE; --purple-ink:#6022c9;
  --teal:#0d9488; --teal-tint:#cdf2ee;

  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#FAFAFC; --surface-3:#F5F6F9;
  --ink:#15171F; --ink-2:#39414F; --muted:#727A8C; --faint:#9aa1b1;
  --line:#E6E8EF; --line-2:#EEF0F5;
  --shadow-sm:0 1px 2px rgba(20,22,31,.05), 0 1px 3px rgba(20,22,31,.04);
  --shadow:0 4px 14px rgba(22,24,33,.07), 0 1px 3px rgba(22,24,33,.05);
  --shadow-lg:0 18px 50px -12px rgba(22,24,33,.22), 0 6px 18px rgba(22,24,33,.08);
  --shadow-brand:0 10px 26px -8px rgba(225,18,38,.45);
  --r-xs:7px; --r-sm:10px; --r:13px; --r-lg:18px; --r-xl:24px; --r-pill:999px;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Plus Jakarta Sans',var(--sans);
  --sidebar-w:248px;
}
[data-theme="dark"]{
  --bg:#0C0E14; --surface:#161924; --surface-2:#1B1F2C; --surface-3:#1F2433;
  --ink:#EDEFF5; --ink-2:#C2C7D4; --muted:#8A91A3; --faint:#646b7d;
  --line:#262B3A; --line-2:#222736;
  --brand-tint:#2A1014; --brand-tint-2:#3a141a;
  --green-tint:#10241a; --amber-tint:#2a2110; --blue-tint:#101a2e; --purple-tint:#1d1430; --teal-tint:#0c2422;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 6px 18px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6); --shadow-brand:0 10px 26px -8px rgba(225,18,38,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
::selection{background:var(--brand-tint-2);color:var(--brand-800)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* base icon size — every icon in the set uses viewBox 0 0 24 24; component rules below override per context. Charts use other viewBoxes and are untouched. */
svg[viewBox="0 0 24 24"]{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}

/* ============================== UTILITIES ============================== */
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}.center{justify-content:center}.end{justify-content:flex-end}
.aic{align-items:center}.ais{align-items:flex-start}.aie{align-items:flex-end}
.grow{flex:1}.mla{margin-left:auto}
.muted{color:var(--muted)}.faint{color:var(--faint)}.ink2{color:var(--ink-2)}
.tac{text-align:center}.tar{text-align:right}
.fw5{font-weight:500}.fw6{font-weight:600}.fw7{font-weight:700}.fw8{font-weight:800}
.fs11{font-size:11px}.fs12{font-size:12px}.fs13{font-size:13px}.fs15{font-size:15px}.fs16{font-size:16px}.fs18{font-size:18px}.fs20{font-size:20px}.fs24{font-size:24px}.fs28{font-size:28px}.fs34{font-size:34px}
.up{text-transform:uppercase;letter-spacing:.09em}
.brand{color:var(--brand)}.green{color:var(--green-ink)}.amber{color:var(--amber-ink)}.blue{color:var(--blue-ink)}.purp{color:var(--purple-ink)}
.hide{display:none!important}
.nowrap{white-space:nowrap}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================== APP SHELL ============================== */
#app{height:100%}
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-brand{padding:18px 18px 14px;display:flex;align-items:center;gap:11px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--brand),var(--brand-700));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-brand);flex:none}
.logo svg{width:21px;height:21px}
.sb-brand .name{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.03em}
.sb-brand .tag{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-top:1px}
.sb-store{margin:2px 12px 8px;position:relative}
.store-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);transition:.15s}
.store-btn:hover{border-color:var(--brand-tint-2);background:var(--brand-tint)}
.store-dot{width:9px;height:9px;border-radius:50%;flex:none}
.store-btn .lbl{font-weight:600;font-size:13px;text-align:left;line-height:1.1}
.store-btn .sub{font-size:10.5px;color:var(--muted)}
.store-menu{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:5px;z-index:50}
.store-opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500}
.store-opt:hover{background:var(--surface-3)}
.store-opt.on{background:var(--brand-tint);color:var(--brand-800);font-weight:600}
.nav{flex:1;overflow-y:auto;padding:6px 12px 16px}
.nav-sec{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:13.5px;cursor:pointer;transition:.13s;position:relative;margin-bottom:1px}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item.on{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}
.nav-item.on .ni-ico{opacity:1}
.ni-ico{width:18px;height:18px;flex:none;opacity:.62;display:flex;align-items:center;justify-content:center}
.ni-ico svg{width:18px;height:18px}
.nav-item .nb{margin-left:auto;background:var(--brand-tint);color:var(--brand-700);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
.nav-item.on .nb{background:rgba(255,255,255,.22);color:#fff}
.sb-foot{padding:10px 14px;border-top:1px solid var(--line)}
.userchip{display:flex;align-items:center;gap:10px;padding:7px;border-radius:11px;cursor:pointer;transition:.13s}
.userchip:hover{background:var(--surface-3)}

.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{height:62px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:16px;padding:0 24px;flex:none;position:sticky;top:0;z-index:30}
.crumb{font-size:12.5px;color:var(--muted);font-weight:500}
.crumb b{color:var(--ink);font-weight:700}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--surface-3);border:1px solid transparent;border-radius:var(--r-pill);padding:8px 15px;transition:.15s}
.search:focus-within{border-color:var(--brand-tint-2);background:var(--surface)}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{border:none;background:none;outline:none;flex:1;font-size:13.5px}
.search input::placeholder{color:var(--faint)}
.kbd{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:600}
.ic-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.14s;position:relative}
.ic-btn:hover{background:var(--surface-3);color:var(--ink)}
.ic-btn svg{width:19px;height:19px}
.dotred{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--brand);border-radius:50%;border:2px solid var(--surface)}
.content{flex:1;overflow-y:auto;scroll-behavior:smooth}
.page{padding:26px 30px 60px;max-width:1320px;margin:0 auto;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:26px}
.page-head .sub{color:var(--muted);font-size:13.5px;margin-top:4px}

/* ============================== COMPONENTS ============================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:15.5px}
.card-h .ch-sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:#fff;flex:none;letter-spacing:-.02em}
.avatar.sm{width:26px;height:26px;font-size:10.5px;border-radius:8px}
.avatar.lg{width:48px;height:48px;font-size:16px;border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:var(--r);transition:.15s;white-space:nowrap;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}
.btn-primary:hover{background:var(--brand-600);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--faint);color:var(--ink);background:var(--surface-2)}
.btn-soft{background:var(--brand-tint);color:var(--brand-700)}
.btn-soft:hover{background:var(--brand-tint-2)}
.btn-dark{background:var(--ink);color:var(--surface)}
.btn-dark:hover{opacity:.88}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip .cdot{width:6px;height:6px;border-radius:50%}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;letter-spacing:.01em}
.t-green{background:var(--green-tint);color:var(--green-ink)}
.t-amber{background:var(--amber-tint);color:var(--amber-ink)}
.t-red{background:var(--brand-tint);color:var(--brand-700)}
.t-blue{background:var(--blue-tint);color:var(--blue-ink)}
.t-purple{background:var(--purple-tint);color:var(--purple-ink)}
.t-gray{background:var(--surface-3);color:var(--muted)}
.t-teal{background:var(--teal-tint);color:var(--teal)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.divider{height:1px;background:var(--line-2);margin:14px 0}
.prog{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.prog > i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.iawrap{background:linear-gradient(135deg,var(--purple-tint),transparent);border:1px solid var(--purple-tint)}
.ia-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--purple-ink);background:var(--purple-tint);padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}

/* grids */
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-3a{grid-template-columns:1.5fr 1fr}
.g-main{grid-template-columns:1fr 360px}
@media(max-width:1180px){.g-kpi{grid-template-columns:repeat(2,1fr)}.g-main,.g-3a{grid-template-columns:1fr}}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi .kico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.kpi .kico svg{width:18px;height:18px}
.kpi .klbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.kpi .kval{font-size:25px;font-weight:800;font-family:var(--disp);letter-spacing:-.03em;line-height:1}
.kpi .kdelta{font-size:11.5px;font-weight:600;margin-top:7px;display:flex;align-items:center;gap:4px}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.1s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.clickable{cursor:pointer}

/* list rows */
.lrow{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line-2);transition:.12s}
.lrow:last-child{border-bottom:none}
.lrow.click{cursor:pointer}
.lrow.click:hover{background:var(--surface-2)}

/* ============================== LOGIN ============================== */
.login{display:grid;grid-template-columns:1.05fr .95fr;height:100vh;overflow:hidden}
.login-hero{background:radial-gradient(120% 120% at 0% 0%,var(--brand) 0%,var(--brand-700) 42%,var(--brand-deep) 100%);color:#fff;padding:54px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);background-size:26px 26px;opacity:.6}
.lh-glow{position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);bottom:-160px;right:-120px}
.login-hero > *{position:relative;z-index:1}
.lh-brand{display:flex;align-items:center;gap:12px;margin-bottom:auto}
.lh-brand .logo{background:rgba(255,255,255,.16);box-shadow:none}
.lh-eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-bottom:18px}
.lh-title{font-size:50px;font-weight:800;line-height:1.04;letter-spacing:-.035em;margin-bottom:22px}
.lh-title .y{color:#FFD7B0;background:linear-gradient(90deg,#FFE3B0,#FFB199);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lh-desc{font-size:16px;line-height:1.6;color:rgba(255,255,255,.9);max-width:440px;margin-bottom:34px}
.lh-feats{display:grid;grid-template-columns:1fr 1fr;gap:13px;max-width:480px}
.lh-feat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:var(--r);padding:14px 15px;backdrop-filter:blur(4px)}
.lh-feat .lf-ic{font-size:18px;margin-bottom:7px}
.lh-feat h4{font-size:13.5px;margin-bottom:3px}
.lh-feat p{font-size:11.5px;color:rgba(255,255,255,.78);line-height:1.45}
.lh-foot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.65);padding-top:30px}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--surface);overflow-y:auto}
.login-form{width:100%;max-width:380px}
.login-form h2{font-size:28px;margin-bottom:6px}
.login-form .lp-sub{color:var(--muted);font-size:14px;margin-bottom:30px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:14px;transition:.15s}
.inp:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-tint)}
.split{display:flex;align-items:center;text-align:center;gap:12px;margin:26px 0 18px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.split::before,.split::after{content:"";flex:1;height:1px;background:var(--line)}
.persona{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;cursor:pointer;transition:.14s}
.persona:hover{border-color:var(--brand-tint-2);background:var(--brand-tint);transform:translateX(2px)}
.persona .pa-meta{flex:1}
.persona .pa-name{font-weight:700;font-size:13.5px}
.persona .pa-role{font-size:11.5px;color:var(--muted)}
.persona .pa-go{color:var(--faint)}
.persona:hover .pa-go{color:var(--brand)}

/* ============================== KANBAN ============================== */
.funil-tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:var(--r);width:max-content}
.funil-tab{padding:7px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.14s;white-space:nowrap}
.funil-tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.board{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;align-items:flex-start}
.kcol{flex:0 0 282px;background:var(--surface-3);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kcol-h{padding:13px 14px 10px;display:flex;align-items:center;gap:8px;position:sticky;top:0}
.kcol-h .kc-dot{width:9px;height:9px;border-radius:50%}
.kcol-h .kc-name{font-weight:700;font-size:13px}
.kcol-h .kc-count{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);padding:1px 8px;border-radius:99px}
.kcol-h .kc-sum{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.kcards{padding:4px 10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1;min-height:40px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:grab;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .1s;position:relative}
.kcard:hover{box-shadow:var(--shadow);border-color:var(--brand-tint-2)}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.45;transform:scale(.97)}
.kcard.locked{border-left:3px solid var(--amber)}
.kcol.over{outline:2px dashed var(--brand-tint-2);outline-offset:-3px}
.kc-veh{font-weight:700;font-size:13.5px;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.kc-cli{font-size:12px;color:var(--muted);margin-bottom:9px}
.kc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.kc-val{font-weight:800;font-size:14px;font-family:var(--disp)}
.kc-meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}

/* ============================== MODAL / DRAWER ============================== */
.overlay{position:fixed;inset:0;background:rgba(15,17,24,.5);backdrop-filter:blur(3px);z-index:200;display:flex;opacity:0;animation:ovin .2s forwards}
@keyframes ovin{to{opacity:1}}
.overlay.right{justify-content:flex-end}
.modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);width:100%;max-width:540px;margin:auto;max-height:90vh;overflow-y:auto;animation:modin .26s cubic-bezier(.2,.9,.3,1)}
@keyframes modin{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.drawer{background:var(--surface);box-shadow:var(--shadow-lg);width:100%;max-width:560px;height:100vh;overflow-y:auto;animation:drin .3s cubic-bezier(.2,.9,.3,1)}
@keyframes drin{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 24px 16px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:var(--r-xl) var(--r-xl) 0 0}
.modal-h h3{font-size:19px}
.modal-b{padding:22px 24px}
.x-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.x-btn:hover{background:var(--surface-3);color:var(--ink)}

/* vehicle photo */
.vphoto{border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;position:relative;overflow:hidden}
.vphoto .vp-fade{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 60%)}
.vphoto .vp-em{position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}

/* segmented */
.seg{display:flex;gap:3px;background:var(--surface-3);padding:3px;border-radius:10px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-22px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2.5px solid var(--brand)}
.tl-dot.gray{border-color:var(--faint)}
.tl-dot.green{border-color:var(--green)}
.tl-dot.purple{border-color:var(--purple)}

/* steps */
.steps{display:flex;gap:0}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;gap:7px}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--green)}
.step .sdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--muted);font-weight:700;font-size:12px;z-index:1;border:2px solid var(--line)}
.step.done .sdot{background:var(--green);color:#fff;border-color:var(--green)}
.step.cur .sdot{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
.step .slbl{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.step.cur .slbl,.step.done .slbl{color:var(--ink)}

/* misc */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .em-ic{font-size:34px;margin-bottom:10px;opacity:.6}
.scrollx{overflow-x:auto}
.miniavs{display:flex}
.miniavs .avatar{margin-left:-7px;border:2px solid var(--surface)}
.miniavs .avatar:first-child{margin-left:0}
.donut-wrap{position:relative;width:120px;height:120px}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:140px}
.bar-chart .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bar-chart .bc-bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--brand),var(--brand-600));transition:height .5s cubic-bezier(.2,.9,.3,1);position:relative}
.bar-chart .bc-bar.ghost{background:var(--surface-3);border:1px dashed var(--line)}
.bar-chart .bc-lbl{font-size:10.5px;color:var(--muted);font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:var(--r);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:500;opacity:0;transition:.3s;display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ti{width:20px;height:20px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}

@media(max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .login{grid-template-columns:1fr}
  .login-hero{display:none}
}
</style>

function go(route,extra={}){Object.assign(state,extra);state.route=route;state.storeMenu=false;render();$('.content')&&($('.content').scrollTop=0);}
function render(){
  if(!state.user||state.route==='login'){$('#app').innerHTML=viewLogin();return;}
  $('#app').innerHTML=shell();
  $('#view').innerHTML=(VIEWS[state.route]||viewPlaceholder)();
  afterRender();
}

      +'<span class="ni-ico">'+I[n.ic]+'</span><span>'+n.nome+'</span>'
      +(b?'<span class="nb">'+b+'</span>':'')+'</div>';

VIEWS.funil=function(){
  const negs=NEG.filter(n=>inLoja(n)&&n.etapa!=='perdido');

      const v=veic(n.veic);const locked=n.locks.length>0;

        +(n.prio?'<span class="tag t-red" style="position:absolute;top:10px;right:10px;font-size:9px;padding:2px 6px">'+I.fire+'</span>':'')
        +'<div class="kc-veh">'+(locked?'<span style="color:var(--amber)">'+I.lock+'</span>':'')+esc(v?veicLabel(v):n.veic)+'</div>'
        +'<div class="kc-cli">'+esc(n.cliente)+' · '+(v?v.ano.split('/')[0]:'')+'</div>'

        +'<div class="kc-foot"><div class="kc-val">'+fmtK(n.valor)+'</div><div class="kc-meta">'+avatar(vNome(n.vend),'sm')+'<span>'+n.criado+'</span></div></div>'
      +'</div>';
    }).join('')||'<div style="padding:14px;text-align:center;color:var(--faint);font-size:12px">Solte cards aqui</div>';
    return '<div class="kcol" data-col="'+e.id+'">'
      +'<div class="kcol-h"><span class="kc-dot" style="background:'+e.cor+'"></span><span class="kc-name">'+e.nome+'</span><span class="kc-count">'+items.length+'</span><span class="kc-sum">'+fmtK(sum)+'</span></div>'

    +'<div class="board">'+cols+'</div>'
  +'</div>';
};

  var fmap = {todos:function(){return true;}, disponivel:function(v){return v.status==='disponivel';}, reservado:function(v){return v.status==='reservado';}, avaliacao:function(v){return v.status==='avaliacao';}};

VIEWS.clientes = function(){
  var list = CLIENTES.filter(inLoja);
  var total = list.length;
  var janela = list.filter(function(c){return c.status==='janela';}).length;
  var prom = list.filter(function(c){return c.nps>=9;}).length;
  var det = list.filter(function(c){return c.nps<=6;}).length;
  var nps = total ? Math.round((prom/total - det/total)*100) : 0;
  var recorrentes = Math.round(total*0.4);
  function npsColor(n){ return n>=9?'var(--green-ink)':(n>=7?'var(--amber-ink)':'var(--brand)'); }
  function statusTag(s){
    if(s==='janela') return '<span class="tag t-purple">janela de troca</span>';
    if(s==='esfriando') return '<span class="tag t-amber">esfriando</span>';
    return '<span class="tag t-green">ativo</span>';
  }
  var rows = list.map(function(c){
    var pgPct = c.parcelas ? Math.round(c.paga/c.parcelas*100) : 0;
    var parts = String(c.fimISO).split('-');
    var fimLbl = parts[1]+'/'+parts[0];
    var mp = mesesPara(c.fimISO);
    var trocaTag = (mp<=4 && mp>=0) ? ' <span class="tag t-red">troca em '+mp+(mp===1?' mês':' meses')+'</span>' : '';
    return '<tr class="clickable" data-cli="'+c.id+'">'
      +'<td><div class="row gap10 aic">'+avatar(c.nome,'sm')+'<div><div class="fw6 fs13">'+esc(c.nome)+'</div><div class="fs12 muted">'+esc(c.cidade)+' · '+esc(lojaNome(c.loja))+'</div></div></div></td>'
      +'<td><div class="fs13">'+esc(c.veiculo)+'</div><div class="fs12 muted">desde '+esc(c.compra)+'</div></td>'
      +'<td style="min-width:140px"><div class="prog" style="height:6px;margin-bottom:5px"><i style="width:'+pgPct+'%;background:var(--brand)"></i></div><div class="fs12 muted mono">'+c.paga+'/'+c.parcelas+' · '+fmt(c.valor)+'/mês</div></td>'
      +'<td><span class="fs13">'+esc(c.banco)+'</span></td>'
      +'<td><div class="fs13 nowrap">'+fimLbl+trocaTag+'</div></td>'
      +'<td><span class="fw7" style="color:'+npsColor(c.nps)+'">'+c.nps+'</span></td>'
      +'<td><span class="fs13">'+esc(vNome(c.vend))+'</span></td>'
      +'<td>'+statusTag(c.status)+'</td>'
      +'</tr>';
  }).join('');
  return '<div class="page" style="max-width:none">'
    +'<div class="page-head"><div><h1>Clientes</h1><div class="sub">'+total+' clientes · <b class="purp">'+janela+'</b> na janela de troca · ~'+recorrentes+' recorrentes</div></div>'
    +'<div class="row gap8"><button class="btn btn-ghost" data-act="importarBase">'+I.doc+'Importar base (CSV)</button><button class="btn btn-primary" data-act="novoCliente">'+I.plus+'Novo cliente</button></div></div>'
    +'<div class="grid g-kpi" style="margin-bottom:18px">'
    +'<div class="kpi"><div class="kico" style="background:var(--blue-tint);color:var(--blue-ink)">'+I.users+'</div><div class="klbl">Total de clientes</div><div class="kval">'+total+'</div>'+deltaTag(6.4)+'</div>'
    +'<div class="kpi"><div class="kico" style="background:var(--purple-tint);color:var(--purple-ink)">'+I.swap+'</div><div class="klbl">Na janela de troca</div><div class="kval">'+janela+'</div><span class="tag t-purple">oportunidade</span></div>'
    +'<div class="kpi"><div class="kico" style="background:var(--green-tint);color:var(--green-ink)">'+I.heart+'</div><div class="klbl">NPS médio</div><div class="kval">'+nps+'</div>'+deltaTag(3.1)+'</div>'
    +'<div class="kpi"><div class="kico" style="background:var(--amber-tint);color:var(--amber-ink)">'+I.star+'</div><div class="klbl">Recorrentes</div><div class="kval">'+recorrentes+'</div><span class="tag t-amber">~'+pct(40)+' da base</span></div>'
    +'</div>'
    +'<div class="card"><div class="card-h"><div><h3>Base de clientes</h3><div class="ch-sub">financiamentos, janela de recompra e relacionamento</div></div><span class="tag t-gray">'+total+' registros</span></div>'
    +'<table class="tbl"><thead><tr><th>Cliente</th><th>Veículo comprado</th><th>Financiamento</th><th>Banco</th><th>Fim do financ.</th><th>NPS</th><th>Vendedor</th><th>Status</th></tr></thead><tbody>'
    +rows+'</tbody></table></div></div>';
};

  var radar=CLIENTES.filter(inLoja).map(function(c){return {c:c,m:mesesPara(c.fimISO)};}).filter(function(o){return o.m>=-1&&o.m<=5;}).sort(function(a,b){return a.m-b.m;});
  radar.forEach(function(o,i){o.sv=dispo.length?dispo[(i+2)%dispo.length]:null;});
  var receita=radar.reduce(function(s,o){return s+(o.sv?o.sv.preco:0);},0);
  function quitaTxt(m,iso){var p=iso.split('-');var mmaa=p[1]+'/'+p[0];if(m<=0)return 'quitou em '+mmaa;return 'quita em '+m+' '+(m===1?'mês':'meses')+' ('+mmaa+')';}
  function stars(n){var s='';for(var i=0;i<5;i++){s+='<span style="width:14px;height:14px;display:inline-flex;color:'+(i<n?'var(--amber-ink)':'var(--line)')+'">'+I.star+'</span>';}return '<div class="row" style="gap:2px">'+s+'</div>';}
  var b2=radar.filter(function(o){return o.m<=2;}).length;
  var b3=radar.filter(function(o){return o.m===3;}).length;
  var b4=radar.filter(function(o){return o.m>=4;}).length;

  var h='<div class="page" style="max-width:none">'
    +'<div class="page-head"><div><h1>Pós-venda &amp; Troca</h1><div class="sub">Combate à recompra silenciosa · janela de troca calculada pela IA · NPS pós-entrega</div></div>'
    +'<div class="row gap8"><button class="btn btn-ghost sm">Junho 2026 ▾</button><button class="btn btn-primary">'+I.bolt+'Campanha de recompra</button></div></div>';

  h+='<div class="grid g-kpi" style="margin-bottom:18px">'
    +'<div class="kpi"><div class="kico" style="background:var(--brand-tint);color:var(--brand)">'+I.fire+'</div><div class="klbl">Na janela agora</div><div class="kval">'+radar.length+'</div>'+deltaTag(20)+'</div>'
    +'<div class="kpi"><div class="kico" style="background:var(--green-tint);color:var(--green-ink)">'+I.swap+'</div><div class="klbl">Trocas fechadas (mês)</div><div class="kval">7</div>'+deltaTag(16.5)+'</div>'
    +'<div class="kpi"><div class="kico" style="background:var(--purple-tint);color:var(--purple-ink)">'+I.heart+'</div><div class="klbl">Taxa de recompra</div><div class="kval">38%</div>'+deltaTag(5.1)+'</div>'
    +'<div class="kpi"><div class="kico" style="background:var(--amber-tint);color:var(--amber-ink)">'+I.cash+'</div><div class="klbl">Receita potencial</div><div class="kval">'+fmtK(receita)+'</div><div class="kdelta muted">'+radar.length+' negócios em aberto</div></div>'
    +'</div>';

  h+='<div class="card pad iawrap" style="margin-bottom:16px"><div class="row ais gap12">'
    +'<div class="kico" style="background:var(--brand-tint);color:var(--brand);flex:none">'+I.robot+'</div>'
    +'<div style="flex:1"><div class="row aic gap8" style="margin-bottom:4px"><span class="fw7 fs15">Radar de Recompra</span><span class="ia-badge">'+I.bolt+' Agente IA</span></div>'
    +'<div class="fs13 muted">Carro financiado em 48×. ~3 meses antes de quitar, o cliente está pronto para trocar. A IA abre a janela, calcula o melhor momento e sugere a abordagem antes que a concorrência fale primeiro.</div></div></div></div>';

  h+='<div class="card" style="margin-bottom:24px"><div class="card-h"><div><h3>Clientes na janela de troca</h3><div class="ch-sub">financiamento terminando · ordenado pelo tempo até a quitação</div></div>'
    +'<div class="row gap6"><span class="chip"><span class="cdot" style="background:var(--brand)"></span>≤2 meses · '+b2+'</span><span class="chip"><span class="cdot" style="background:var(--amber-ink)"></span>3 meses · '+b3+'</span><span class="chip"><span class="cdot" style="background:var(--blue-ink)"></span>4–5 meses · '+b4+'</span></div></div>';

  if(!radar.length){
    h+='<div class="empty"><div class="em-ic">🔁</div><h3>Nenhum cliente na janela</h3><p class="muted">Ninguém com financiamento terminando nesta loja agora.</p></div>';
  } else {
    radar.forEach(function(o){
      var c=o.c, sv=o.sv;
      var tg=o.m<=0?'<span class="tag t-gray">quitado · reativar</span>':(o.m<=4?'<span class="tag t-amber">janela aberta</span>':'<span class="tag t-blue">aproximando</span>');
      var sugg=sv
        ?'<div class="fs11 muted">'+I.swap.replace('<svg','<svg width="11" height="11" style="vertical-align:-1px"')+' sugestão de troca</div><div class="fw6 fs12">'+esc(veicLabel(sv))+'</div><div class="fs11 brand fw6">'+fmt(sv.preco)+'</div>'
        :'<div class="fs11 muted">sem sugestão disponível</div>';
      h+='<div class="lrow">'+avatar(c.nome,'sm')
        +'<div style="flex:1;min-width:0"><div class="row aic gap8"><span class="fw6 fs13 click" data-cli="'+c.id+'">'+esc(c.nome)+'</span>'+tg+'</div>'
        +'<div class="fs12 muted clip">'+esc(c.veiculo)+' · '+esc(c.banco)+' '+c.parcelas+'× · '+quitaTxt(o.m,c.fimISO)+'</div></div>'
        +'<div class="tar nowrap" style="min-width:160px">'+sugg+'</div>'
        +'<button class="btn btn-soft sm" data-act="abordarWpp" data-cli="'+c.id+'">'+I.wpp+'Abordar</button>'
        +'</div>';
    });
  }
  h+='</div>';

  h+='<div class="row aic gap8" style="margin:8px 0 14px"><span style="width:20px;height:20px;display:inline-flex;color:var(--purple-ink)">'+I.heart+'</span><span class="fw7 fs18">Satisfação &amp; NPS</span><span class="tag t-purple">pós-entrega</span></div>';

  var circ=2*Math.PI*50;
  h+='<div class="grid g-3a" style="margin-bottom:18px">'
    +'<div class="card pad"><div class="row gap20 aic">'
    +'<div style="flex:none;position:relative"><svg viewBox="0 0 120 120" width="150" height="150">'
    +'<circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="12"/>'
    +'<circle cx="60" cy="60" r="50" fill="none" stroke="var(--green-ink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*0.27)+'" transform="rotate(-90 60 60)"/>'
    +'<text x="60" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">73</text>'
    +'<text x="60" y="75" text-anchor="middle" font-size="10" fill="var(--muted)">NPS</text>'
    +'</svg></div>'
    +'<div style="flex:1"><div class="row aic gap8"><span class="fw8 fs20 green">Excelente</span>'+deltaTag(4)+'</div>'
    +'<div class="fs12 muted" style="margin:4px 0 12px">Zona de excelência (acima de 70) · base de 124 respostas</div>'
    +'<div style="margin-bottom:8px"><div class="row between fs12"><span class="fw6">Promotores</span><span class="green fw6">79%</span></div><div class="prog" style="height:7px"><i style="width:79%;background:var(--green-ink)"></i></div></div>'
    +'<div style="margin-bottom:8px"><div class="row between fs12"><span class="fw6">Neutros</span><span class="amber fw6">15%</span></div><div class="prog" style="height:7px"><i style="width:15%;background:var(--amber-ink)"></i></div></div>'
    +'<div><div class="row between fs12"><span class="fw6">Detratores</span><span class="brand fw6">6%</span></div><div class="prog" style="height:7px"><i style="width:6%;background:var(--brand)"></i></div></div>'
    +'</div></div>'
    +'<div class="divider"></div>'
    +'<div class="row gap8 aic"><span style="width:16px;height:16px;display:inline-flex;color:var(--green-ink)">'+I.wpp+'</span><div class="fs12 muted"><b class="ink2">Pesquisa rápida por WhatsApp</b>, enviada logo após a entrega: "Como foi sua experiência? Nota de 0 a 10 + 1 pergunta." Carro usado pode ter imprevisto — a pesquisa veloz captura o problema cedo.</div></div>'
    +'</div>'
    +'<div class="card pad"><div class="card-h" style="padding:0 0 4px"><div><h3>Promotores</h3><div class="ch-sub">peça a avaliação pública enquanto a empolgação está fresca</div></div><span class="tag t-green">'+REVIEWS.length+'</span></div>';
  REVIEWS.forEach(function(r){
    h+='<div class="lrow" style="align-items:flex-start"><div style="flex:1">'
      +'<div class="row between aic">'+stars(r.nota)+'<button class="btn btn-ghost sm" data-act="pedirGoogle">'+I.star+'Avaliar no Google</button></div>'
      +'<div class="fs13" style="margin:6px 0">"'+esc(r.txt)+'"</div>'
      +'<div class="fs12 muted">'+esc(r.cli)+' · '+esc(r.veic)+' · '+esc(r.quando)+'</div>'
      +'</div></div>';
  });
  h+='</div></div>';

  h+='<div class="card pad" style="border-left:3px solid var(--brand);margin-bottom:8px">'
    +'<div class="card-h" style="padding:0 0 8px"><div><h3>Recuperação ativada</h3><div class="ch-sub">detratores entram em fluxo de resgate imediato com o gestor</div></div><span class="tag t-red">'+DETRATORES.length+' detrator</span></div>';
  DETRATORES.forEach(function(d){
    h+='<div class="lrow" style="align-items:flex-start"><div style="flex:1">'
      +'<div class="row between aic"><span class="tag t-red">'+I.shield+' nota '+d.nota+'/5</span>'+stars(d.nota)+'</div>'
      +'<div class="fs13" style="margin:6px 0">"'+esc(d.txt)+'"</div>'
      +'<div class="fs12 muted" style="margin-bottom:10px">'+esc(d.cli)+' · '+esc(d.veic)+' · '+esc(d.quando)+'</div>'
      +'<div class="row gap8"><button class="btn btn-primary sm" data-act="acionarGestor">'+I.bell+'Acionar gestor</button><button class="btn btn-ghost sm" data-act="agendarCall">'+I.phone+'Agendar call</button></div>'

};

VIEWS.agente=function(){
  var leads=LEADS.filter(inLoja);
  var recompra=CLIENTES.filter(function(c){var m=mesesPara(c.fimISO);return inLoja(c)&&m<=4&&m>=-1;});
  var slaTag={novo:'t-blue',atencao:'t-amber',ok:'t-gray'};
  var slaLbl={novo:'novo',atencao:'atenção',ok:'em dia'};

  var h='<div class="page" style="max-width:none">'
    +'<div class="page-head"><div><h1>Agente IA</h1><div class="sub">varredura contínua · monitora portais, carteira própria e a janela de financiamento</div></div>'
    +'<div class="row gap8"><button class="btn btn-ghost sm">'+I.gear+'Configurar fontes</button><button class="btn btn-primary">'+I.bolt+'Disparar campanha</button></div></div>';

  // status bar
  h+='<div class="card pad iawrap" style="margin-bottom:18px">'
    +'<div class="row between aic wrap gap16">'
    +'<div class="row gap10 aic"><span class="ia-badge">'+I.bolt+' Agente IA</span><span class="tag t-green"><span class="dot" style="background:var(--green-ink)"></span> Ativo</span></div>'
    +'<div class="row gap24 wrap aic">'
    +'<div><div class="klbl">Última varredura</div><div class="fw7 fs15">há 12 min</div></div>'
    +'<div><div class="klbl">Próxima</div><div class="fw7 fs15">em 18 min</div></div>'
    +'<div><div class="klbl">Leads encontrados (7d)</div><div class="fw7 fs15">47</div></div>'
    +'<div><div class="klbl">Conversão estimada</div><div class="fw7 fs15 green">23%</div></div>'
    +'</div></div></div>';

  h+='<div class="grid g-2" style="align-items:start">';

  // LEFT — oportunidades detectadas
  var left='<div class="card"><div class="card-h"><div><h3>Oportunidades detectadas</h3><div class="ch-sub">recompra da base + sinais de mercado</div></div><span class="tag t-purple">'+(recompra.length+3)+'</span></div>';

  recompra.forEach(function(c){
    var sc=Math.max(90,c.nps*10);
    var m=mesesPara(c.fimISO);
    var janela=m<=0?'já quitou':'quita em '+m+(m===1?' mês':' meses');
    left+='<div class="lrow" style="align-items:flex-start">'
      +'<div class="kico" style="background:var(--brand-tint);color:var(--brand);min-width:46px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">'+sc+'</div>'
      +'<div style="flex:1">'
      +'<div class="row gap6 aic"><span class="fw6 fs13">'+esc(c.nome)+'</span><span class="tag t-amber">janela de troca</span></div>'
      +'<div class="fs12 muted">'+esc(c.veiculo)+' · '+janela+' · '+esc(lojaNome(c.loja))+'</div>'
      +'<div class="fs12 ink2" style="margin-top:4px">'+I.bolt+' Abordagem: oferecer upgrade com entrada coberta pelo saldo + avaliação do usado.</div>'
      +'<div class="row gap6" style="margin-top:8px"><button class="btn btn-soft sm" data-act="recompra" data-id="'+c.id+'">→ Lead Inbox</button><button class="btn btn-ghost sm" data-act="descartarOp" data-id="'+c.id+'">Descartar</button></div>'
      +'</div></div>';
  });

  var sinais=[
    {sc:84,t:'Feirão FENABRAVE em São Paulo',d:'Pico de intenção de compra previsto para o próximo fim de semana na região.',src:'fenabrave.org.br',ab:'Antecipar follow-up com leads frios e divulgar condições especiais.'},
    {sc:78,t:'Alta busca por SUVs compactos no Webmotors',d:'Buscas por SUV compacto subiram 31% na sua região nos últimos 14 dias.',src:'webmotors.com.br/insights',ab:'Subir anúncios de SUVs e priorizar leads com esse interesse.'},
    {sc:71,t:'Queda de preço FIPE em sedans 2019-2021',d:'Boa janela para giro de estoque parado com margem ainda saudável.',src:'fipe.org.br',ab:'Reprecificar sedans com mais de 60 dias em estoque.'}
  ];
  sinais.forEach(function(s){
    left+='<div class="lrow" style="align-items:flex-start">'
      +'<div class="kico" style="background:var(--blue-tint);color:var(--blue-ink);min-width:46px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">'+s.sc+'</div>'
      +'<div style="flex:1">'
      +'<div class="row gap6 aic"><span class="fw6 fs13">'+esc(s.t)+'</span><span class="tag t-blue">mercado</span></div>'
      +'<div class="fs12 muted">'+esc(s.d)+'</div>'
      +'<div class="fs12 ink2" style="margin-top:4px">'+I.bolt+' Abordagem: '+esc(s.ab)+'</div>'
      +'<div class="row between aic" style="margin-top:8px"><span class="fs11 faint mono">'+esc(s.src)+'</span><div class="row gap6"><button class="btn btn-soft sm" data-act="recompra" data-id="">Ver detalhe</button><button class="btn btn-ghost sm" data-act="descartarOp" data-id="">Ignorar</button></div></div>'
      +'</div></div>';
  });
  left+='</div>';

  // RIGHT — Lead Inbox
  var right='<div class="card"><div class="card-h"><div><h3>Lead Inbox · triagem</h3><div class="ch-sub">todo lead passa por aqui antes do funil</div></div><span class="tag t-red">'+leads.length+'</span></div>';
  if(!leads.length){
    right+='<div class="empty"><div class="em-ic">📥</div><h3>Inbox vazia</h3><p class="muted">Nenhum lead aguardando triagem nesta loja.</p></div>';
  } else {
    leads.forEach(function(l){
      var o=ORIGEM[l.origem]||{n:l.origem,c:'var(--muted)'};
      right+='<div class="lrow" style="align-items:flex-start">'
        +'<div class="kico" style="background:var(--surface-3);color:var(--ink);min-width:46px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">'+l.score+'</div>'
        +'<div style="flex:1">'
        +'<div class="row between aic"><span class="fw6 fs13">'+esc(l.nome)+'</span><span class="tag '+(slaTag[l.sla]||'t-gray')+'">'+esc(slaLbl[l.sla]||l.sla)+'</span></div>'
        +'<div class="row gap6 aic" style="margin:2px 0"><span class="chip"><span class="cdot" style="background:'+o.c+'"></span>'+esc(o.n)+'</span><span class="fs12 muted">'+esc(l.interesse)+'</span></div>'
        +'<div class="row gap10 fs12 faint"><span>'+I.clock+' '+esc(l.quando)+'</span><span class="mono">'+esc(l.tel)+'</span></div>'
        +'<div class="row gap6" style="margin-top:8px"><button class="btn btn-soft sm" data-act="qualificar" data-id="'+l.id+'">✓ Qualificar</button><button class="btn btn-ghost sm" data-act="descartar" data-id="'+l.id+'">Descartar</button></div>'
        +'</div></div>';
    });
  }
  right+='</div>';

  h+=left+right+'</div>';

  h+='<div class="card pad iawrap" style="margin-top:18px"><div class="row gap10 aic"><span class="ia-badge">'+I.shield+' Princípio</span><span class="fs13 ink2"><b>A pessoa decide, a IA propõe.</b> Todo lead chega aqui antes de virar negócio.</span></div></div>';

  h+='</div>';
  return h;
};

ACTIONS.qualificar=function(el){
  var id=el.dataset.id;
  var i=LEADS.findIndex(function(l){return l.id===id;});
  if(i>-1)LEADS.splice(i,1);
  toast('Lead qualificado','Entrou no Funil de Vendas');
  render();
};
ACTIONS.descartar=function(el){
  var id=el.dataset.id;
  var i=LEADS.findIndex(function(l){return l.id===id;});
  if(i>-1)LEADS.splice(i,1);
  toast('Lead descartado');
  render();
};
ACTIONS.recompra=function(el){
  toast('Oportunidade enviada','Agora está na Lead Inbox para triagem');
};
ACTIONS.descartarOp=function(el){
  toast('Oportunidade descartada');
};

ACTIONS.wppSend = function(){
  var inp = document.getElementById('wppInput');
  var box = document.getElementById('wppMsgs');
  if(!inp || !box) return;
  var v = inp.value.trim();
  if(!v) return;
  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end';
  var b = document.createElement('div');
  b.style.cssText = 'max-width:70%;padding:9px 12px;border-radius:14px;border-bottom-right-radius:4px;background:var(--brand);color:#fff;font-size:13px;line-height:1.45';
  b.textContent = v;
  var t = document.createElement('div');
  t.className = 'faint fs11';
  t.style.cssText = 'margin:3px 4px 0';
  t.textContent = 'agora';
  wrap.appendChild(b); wrap.appendChild(t);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
  if(window._wppThreads[window._wppSel]) window._wppThreads[window._wppSel].push({t:'out', tx:v, tm:'agora'});
  inp.value = '';
  toast('Mensagem enviada', 'via API Oficial da Meta');
};

WIRE.whatsapp = function(){
  var box = document.getElementById('wppMsgs');
  if(box) box.scrollTop = box.scrollHeight;
  var inp = document.getElementById('wppInput');
  if(inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter') ACTIONS.wppSend(); });
};

WIRE.dealDrawer=function(id){
  var n=NEG.find(function(x){return x.id===id;});
  if(!n) return;
  function gv(fid){var el=document.getElementById(fid);return el?el.value:null;}
  function recompute(){
    var P=n.valor;
    var entrada=parseFloat(gv('sim-entrada'))||0;
    var nn=parseInt(gv('sim-parc'),10)||48;
    var taxa=parseFloat(gv('sim-taxa'));
    if(isNaN(taxa)) taxa=1.49;
    var i=taxa/100;
    var fin=Math.max(P-entrada,0);
    var pmt=i>0?fin*i/(1-Math.pow(1+i,-nn)):fin/nn;
    var pe=document.getElementById('sim-parcela'); if(pe) pe.textContent=fmt(Math.round(pmt));
    var te=document.getElementById('sim-total'); if(te) te.textContent=fmt(Math.round(pmt*nn+entrada));
  }
  ['sim-entrada','sim-parc','sim-taxa'].forEach(function(fid){
    var el=document.getElementById(fid);
    if(el){el.addEventListener('input',recompute);el.addEventListener('change',recompute);}
  });
};

    +'<div class="grid g-2 gap12">'
    +'<div class="field"><label>Veículo de interesse</label><select class="inp" id="nn-veic">'+veicOpts+'</select></div>'
    +'<div class="field"><label>Valor</label><input class="inp" id="nn-valor" value="'+fmt(v0.preco)+'"></div>'
    +'<div class="field"><label>Loja</label><select class="inp" id="nn-loja">'+lojaOpts+'</select></div>'
    +'<div class="field"><label>Vendedor</label><select class="inp" id="nn-vend">'+vendOpts+'</select></div>'
    +'<div class="field"><label>Etapa inicial</label><select class="inp" id="nn-etapa">'+etapaOpts+'</select></div>'
    +'<div class="field"><label>Origem</label><select class="inp" id="nn-origem">'+origemOpts+'</select></div>'
    +'</div>'
    +'<label class="lrow click" style="cursor:pointer;margin-top:4px"><input type="checkbox" id="nn-quente"><div class="grow fs13 fw6">🔥 Marcar como quente</div><span class="fs12 muted">prioriza no funil</span></label>'
    +'<div class="row gap8" style="margin-top:16px"><button class="btn btn-ghost grow" data-close>Cancelar</button><button class="btn btn-primary grow" data-act="criarNeg">'+I.plus+'Criar negócio</button></div>'
    +'</div>';
};

WIRE.novoNegocio=function(){
  var sel=$('#nn-veic'), val=$('#nn-valor');
  if(sel&&val){ sel.addEventListener('change',function(){ var v=veic(sel.value); if(v) val.value=fmt(v.preco); }); }
};

ACTIONS.criarNeg=function(){
  var nome=($('#nn-cliente')&&$('#nn-cliente').value.trim())||'Novo cliente';
  var veicId=($('#nn-veic')&&$('#nn-veic').value)||VEIC[0].id;
  var valorRaw=($('#nn-valor')&&$('#nn-valor').value)||'';
  var vobj=veic(veicId);
  var valor=parseInt(String(valorRaw).replace(/\D/g,''),10)||(vobj?vobj.preco:0);
  var loja=($('#nn-loja')&&$('#nn-loja').value)||LOJAS[0].id;
  var vend=($('#nn-vend')&&$('#nn-vend').value)||VEND[0].id;
  var etapa=($('#nn-etapa')&&$('#nn-etapa').value)||'lead';
  var quente=!!($('#nn-quente')&&$('#nn-quente').checked);
  NEG.push({id:'n'+(NEG.length+1),veic:veicId,cliente:nome,valor:valor,etapa:etapa,vend:vend,loja:loja,score:quente?72:50,prio:quente,criado:'agora',locks:[]});
  toast('Negócio criado','Entrou no Funil');
  closeOverlay();
  go('funil');
};
/* ===== GENERATED MODULES (end) ===== */

/* ----------------------------- AFTER RENDER ----------------------------- */
function afterRender(){
  if(state.route==='funil')wireKanban();
  if(WIRE[state.route])WIRE[state.route]();
}
function wireKanban(){
  let dragId=null;
  $$('.kcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.deal;setTimeout(()=>card.classList.add('drag'),0);e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('drag');$$('.kcol').forEach(c=>c.classList.remove('over'));});
  });
  $$('.kcards').forEach(zone=>{
    const col=zone.closest('.kcol');
    zone.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});
    zone.addEventListener('dragleave',e=>{if(!zone.contains(e.relatedTarget))col.classList.remove('over');});
    zone.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');
      const target=zone.dataset.drop;const n=NEG.find(x=>x.id===dragId);
      if(n&&n.etapa!==target){
        if(n.locks.length&&ETAPAS.findIndex(x=>x.id===target)>ETAPAS.findIndex(x=>x.id===n.etapa)){
          toast('Negócio travado','Resolva '+n.locks.length+' campo(s) obrigatório(s) antes de avançar');
        }else{
          n.etapa=target;
          if(target==='vendido')toast('🎉 Venda registrada!',n.cliente+' · '+fmtK(n.valor));
          else toast('Negócio movido para '+etapaNome(target));
          render();
        }
      }
    });
  });
}

/* ----------------------------- OVERLAY UTILITIES ----------------------------- */
function closeOverlay(){const o=$('#overlay-root');o.innerHTML='';document.body.style.overflow='';}
function openModal(html,maxw){$('#overlay-root').innerHTML='<div class="overlay" data-ovbg><div class="modal"'+(maxw?' style="max-width:'+maxw+'px"':'')+'>'+html+'</div></div>';document.body.style.overflow='hidden';}
function openDrawer(html){$('#overlay-root').innerHTML='<div class="overlay right" data-ovbg><div class="drawer">'+html+'</div></div>';document.body.style.overflow='hidden';}
function openDeal(id){state.dealId=id;if(window.dealDrawerHtml){openDrawer(dealDrawerHtml(id));if(WIRE.dealDrawer)WIRE.dealDrawer(id);}else toast('Abrindo negócio…');}
function openVeh(id){state.vehId=id;if(window.vehModalHtml){openModal(vehModalHtml(id),760);if(WIRE.vehModal)WIRE.vehModal(id);}else toast('Abrindo veículo…');}
function openNovoNegocio(){if(window.novoNegocioHtml){openModal(novoNegocioHtml());if(WIRE.novoNegocio)WIRE.novoNegocio();}else toast('Novo negócio','Formulário em breve');}

/* ----------------------------- DELEGATED CLICK HANDLER ----------------------------- */
function onClick(e){
  const pick=sel=>e.target.closest(sel);
  if(pick('[data-close]')){closeOverlay();return;}
  if(e.target.hasAttribute&&e.target.hasAttribute('data-ovbg')){closeOverlay();return;}
  let n;
  if(n=pick('[data-login]')){const v=VEND.find(x=>x.id===n.dataset.login);state.user=v;state.loja=v.loja==='all'?'all':v.loja;go('dashboard');toast('Bem-vindo, '+v.nome.split(' ')[0]+'!','Acessando o painel da revenda');return;}
  if(n=pick('#storeBtn')){e.stopPropagation();state.storeMenu=!state.storeMenu;render();return;}
  if(n=pick('[data-store]')){state.loja=n.dataset.store;state.storeMenu=false;render();return;}
  if(n=pick('#themeBtn')){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',state.theme);render();return;}
  if(n=pick('[data-act]')){const f=ACTIONS[n.dataset.act];if(f){e.preventDefault();f(n);}return;}
  if(n=pick('[data-deal]')){openDeal(n.dataset.deal);return;}
  if(n=pick('[data-veh]')){openVeh(n.dataset.veh);return;}
  if(n=pick('[data-cli]')){go('cliente',{clientId:n.dataset.cli});return;}
  if(n=pick('[data-nav]')){go(n.dataset.nav);return;}
  if(state.storeMenu&&!pick('.sb-store')){state.storeMenu=false;render();}
}

/* ----------------------------- BOOT ----------------------------- */
ACTIONS.novoNegocio=()=>openNovoNegocio();
document.documentElement.setAttribute('data-theme',state.theme);
document.addEventListener('click',onClick);
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();});
render();
</script>
